name: Review checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install review dependencies
        run: python -m pip install numpy pandas scipy scikit-learn
      - name: Check isolated helpers and notebook consistency
        run: python -m unittest discover -s tests -v
      - name: Reconcile supplied historical results
        run: python tools/verify_saved_results.py
